events {}

http {
  server {
    listen 80;
    server_name todo-app.myrrhsolutions.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443;
    server_name todo-app.myrrhsolutions.in;

    # ssl_certificate /etc/letsencrypt/live/todo-app.myrrhsolutions.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/todo-app.myrrhsolutions.in/privkey.pem;

    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}